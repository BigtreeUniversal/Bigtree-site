<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Tree Ecosystem | Checkout Direct</title>
    <style>
        :root {
            --bg-page: #000000;
            --bg-card: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-blue: #3b82f6;
            --border: #1a1a1a;
            --terminal-green: #00ff41;
            --terminal-bg: #050505;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; padding: 20px; background: var(--bg-page); 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .checkout-card {
            background: var(--bg-card);
            width: 100%; max-width: 440px;
            padding: 30px; border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); }
        .network-badge { 
            background: rgba(59, 130, 246, 0.1); color: var(--accent-blue);
            padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 700;
            letter-spacing: 1px; border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .product-meta { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .cover-container {
            width: 80px; height: 80px; flex-shrink: 0;
            border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #111;
        }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .product-info { flex-grow: 1; text-align: left; }
        .product-title { font-size: 16px; font-weight: 700; color: #fff; margin: 0 0 4px 0; }
        .product-artist { font-size: 12px; color: var(--text-muted); margin: 0 0 6px 0; }
        .product-price { font-size: 16px; font-weight: 800; color: var(--accent-blue); }
        .fiat-price { font-size: 11px; color: var(--text-muted); font-family: monospace; }

        .payment-zone {
            background: #0d0d0d; border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px;
        }
        .qr-box { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin-bottom: 12px; }
        .qr-box img { width: 140px; height: 140px; display: block; }
        
        .address-box {
            background: #151515; border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.2s;
        }
        .address-box:hover { border-color: var(--accent-blue); }
        .address-text { font-family: monospace; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-pay {
            background: #ffffff; color: #000000; width: 100%; padding: 14px;
            border-radius: 10px; font-weight: 700; font-size: 14px;
            border: none; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; margin-bottom: 15px;
        }
        .btn-pay:hover { opacity: 0.9; }

        .terminal-box {
            background: var(--terminal-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 12px;
            font-family: "Courier New", Courier, monospace; font-size: 11px;
            color: var(--terminal-green); text-align: left;
            min-height: 85px; max-height: 100px; overflow-y: auto;
            line-height: 1.4;
        }
        .terminal-line { margin: 0 0 3px 0; word-break: break-all; }
        .terminal-line::before { content: "> "; color: var(--text-muted); }
        .terminal-line.error { color: #ff4444; }
        .terminal-line.success { color: #00ff41; font-weight: bold; }

        @media (max-width: 480px) {
            .checkout-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <div class="header">
            <img src="https://bigtreeconnection.com/home/logo_buhs_small.png" class="logo" alt="Logo">
            <span class="network-badge">BASE NETWORK</span>
        </div>

        <div class="product-meta">
            <div class="cover-container">
                <img src="https://odd-brown-pike.myfilebase.com/ipfs/QmQkXBmi6iLLAUyXpSFd6Aj8oTGaWMVB8ECu8ajvJEo84v" alt="Cover" class="cover-image" onerror="this.src='https://via.placeholder.com/150/111111/888888?text=Cover';">
            </div>
            <div class="product-info">
                <h1 class="product-title">Too Deep for Words</h1>
                <p class="product-artist">Oliver Bigtree • 2019</p>
                <div>
                    <span class="product-price">0.003 ETH</span>
                    <span id="fiat-display" class="fiat-price"></span>
                </div>
            </div>
        </div>

        <div class="payment-zone">
            <!-- QR code lié au Deep Link nativement -->
            <a id="qr-link" href="#">
                <div class="qr-box">
                    <img id="qr-img" src="" alt="Scan QR">
                </div>
            </a>
            <div class="address-box" onclick="copyAddress()" title="Cliquer pour copier">
                <span class="address-text" id="wallet-addr">0x3150808afe0cfb4fd22ee0d2249f48260a7377ac</span>[cite: 1]
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </div>
        </div>

        <!-- Bouton Deep Link direct vers App Wallet -->
        <a id="pay-btn-link" href="#" class="btn-pay">
            <span>Ouvrir dans le Wallet</span>
        </a>

        <!-- Console / Watcher live -->
        <div id="terminal" class="terminal-box">
            <div class="terminal-line">Initialisation du watcher Base...</div>
        </div>
    </div>

    <textarea id="copy-textarea" style="position: absolute; left: -9999px; top: 0;" readonly></textarea>

    <script>
        const DESTINATION_WALLET = '0x3150808afe0cfb4fd22ee0d2249f48260a7377ac';[cite: 1]
        const PRIX_ETH = 0.003;
        const FILE_KEY = 'releases/2019-Too-Deep-for-Words/2019-Too-Deep-for-Words.zip';
        const WORKER_URL = 'https://base-r2-watcher.oliverbigtree.workers.dev';

        // Génération du lien de transaction Web3 standard
        const weiValue = BigInt(Math.round(PRIX_ETH * 1e18)).toString();
        const web3Uri = `ethereum:${DESTINATION_WALLET}@8453?value=${weiValue}`;

        // Mise à jour de l'UI avec le lien
        document.getElementById('pay-btn-link').href = web3Uri;
        document.getElementById('qr-link').href = web3Uri;
        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(web3Uri)}`;

        function logConsole(msg, type = 'normal') {
            const terminal = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.innerText = msg;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function copyAddress() {
            const addrText = document.getElementById('wallet-addr').innerText;
            const textArea = document.getElementById('copy-textarea');
            textArea.value = addrText;
            textArea.select();
            document.execCommand('copy');
            logConsole("Adresse copiée dans le presse-papier !");
        }

        // Ecouteur en arrière-plan (Watcher Polling)
        let isVerified = false;
        async function checkPaymentStatus() {
            if (isVerified) return;

            try {
                // Interrogation du Worker pour savoir si la transaction du produit a été vue récemment
                const res = await fetch(`${WORKER_URL}/check-order?target=${DESTINATION_WALLET}&amount=${PRIX_ETH}&file=${encodeURIComponent(FILE_KEY)}`);
                const data = await res.json();

                if (data.status === 'success' && data.downloadUrl) {
                    isVerified = true;
                    logConsole("Paiement détecté sur la blockchain !", "success");
                    logConsole("Lancement du téléchargement R2...", "success");
                    setTimeout(() => {
                        window.location.href = data.downloadUrl;
                    }, 1000);
                } else {
                    // On continue d'écouter toutes les 3 secondes
                    setTimeout(checkPaymentStatus, 3000);
                }
            } catch (err) {
                setTimeout(checkPaymentStatus, 4000);
            }
        }

        // Conversion Fiat
        async function fetchFiatPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=eur,usd');
                const data = await res.json();
                const totalEur = (PRIX_ETH * data.ethereum.eur).toFixed(2);
                const totalUsd = (PRIX_ETH * data.ethereum.usd).toFixed(2);
                document.getElementById('fiat-display').innerText = ` (~${totalEur} € / $${totalUsd})`;
            } catch (err) {
                document.getElementById('fiat-display').innerText = '';
            }
        }

        // Lancement initial
        fetchFiatPrice();
        logConsole("En attente de réception du paiement on-chain...");
        checkPaymentStatus();
    </script>
</body>
</html>
